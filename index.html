];

function initEdit(){var pc=document.getElementById("editPresets");if(pc.children.length===0||pc.dataset.lang!==lang){pc.dataset.lang=lang;pc.innerHTML=editPresets.map(function(p,i){return '<div class="preset-card'+(i===0?" active":"")+'" data-preset="'+i+'"><div class="preset-thumb"><canvas width="72" height="72" id="thumb'+i+'"></canvas></div><div class="preset-name">'+p.name+'</div></div>'}).join("");if(editOriginalImg)drawAllThumbs()}}

function applyPresetToSliders(idx){var p=editPresets[idx].params;var map={exposure:0,contrast:0,saturation:0,warmth:0,sharpness:0,vignette:0,smooth:0};for(var k in p){map[k]=p[k]}["exposure","contrast","saturation","warmth","sharpness","vignette","smooth"].forEach(function(k){var sl=document.getElementById("s-"+k);var vl=document.getElementById("v-"+k);if(sl){sl.value=map[k]||0;vl.textContent=map[k]||0}})}
function triggerEditUpload(){document.getElementById("editFileInput").click()}
function handleEditUpload(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(ev){var img=new Image();img.onload=function(){editOriginalImg=img;var maxW=400;var ratio=img.height/img.width;editImgW=Math.min(maxW,img.width);editImgH=Math.round(editImgW*ratio);editCanvas=document.createElement("canvas");editCanvas.width=editImgW;editCanvas.height=editImgH;editCanvas.className="edit-preview-canvas";editCtx=editCanvas.getContext("2d");var uw=document.getElementById("editUploadWrap");uw.classList.add("has-image");uw.style.display="none";document.getElementById("editTools").style.display="block";var ts=document.getElementById("editTools");ts.insertBefore(editCanvas,ts.firstChild);editCtx.drawImage(editOriginalImg,0,0,editImgW,editImgH);editBaseData=editCtx.getImageData(0,0,editImgW,editImgH);drawAllThumbs();applyEdit()};img.src=ev.target.result};reader.readAsDataURL(file)}
function drawAllThumbs(){editPresets.forEach(function(p,i){var tc=document.getElementById("thumb"+i);if(!tc)return;var tctx=tc.getContext("2d");var tw=72,th=72;tctx.clearRect(0,0,tw,th);if(editOriginalImg){var ir=editOriginalImg.height/editOriginalImg.width;var dw,dh,dx,dy;if(ir>1){dw=tw;dh=tw*ir;dx=0;dy=(th-dh)/2}else{dh=th;dw=th/ir;dx=(tw-dw)/2;dy=0}tctx.drawImage(editOriginalImg,dx,dy,dw,dh);applyFilterToCtx(tctx,tw,th,p.params)}})}
function applyEdit(){if(!editCtx||!editOriginalImg||!editBaseData)return;var params={exposure:parseFloat(document.getElementById("s-exposure").value),contrast:parseFloat(document.getElementById("s-contrast").value),saturation:parseFloat(document.getElementById("s-saturation").value),warmth:parseFloat(document.getElementById("s-warmth").value),sharpness:parseFloat(document.getElementById("s-sharpness").value),vignette:parseFloat(document.getElementById("s-vignette").value),smooth:parseFloat(document.getElementById("s-smooth").value)};["exposure","contrast","saturation","warmth","sharpness","vignette","smooth"].forEach(function(k){var vl=document.getElementById("v-"+k);if(vl)vl.textContent=params[k]});var imgData=new ImageData(new Uint8ClampedArray(editBaseData.data),editBaseData.width,editBaseData.height);applyFilterToData(imgData.data,editImgW,editImgH,params);editCtx.putImageData(imgData,0,0)}
function applyFilterToCtx(ctx,w,h,p){try{var imgData=ctx.getImageData(0,0,w,h);applyFilterToData(imgData.data,w,h,p);ctx.putImageData(imgData,0,0)}catch(e){}}
function applyFilterToData(d,w,h,p){
 var exp=(p.exposure||0)/100;var con=(p.contrast||0)/100;var sat=(p.saturation||0)/100;var warm=(p.warmth||0)/100*30;var sharp=(p.sharpness||0)/100;var vig=(p.vignette||0)/100;var sm=(p.smooth||0)/100;
 var orig=null;if(sharp>0||sm>0){orig=new Uint8ClampedArray(d)}
 // Exposure, Contrast, Warmth, Saturation
 for(var i=0;i<d.length;i+=4){
  var r=d[i],g=d[i+1],b=d[i+2];
  if(exp!==0){r+=exp*128;g+=exp*128;b+=exp*128}
  if(con!==0){var cf=1+con;r=(r-128)*cf+128;g=(g-128)*cf+128;b=(b-128)*cf+128}
  if(warm!==0){r+=warm;b-=warm}
  if(sat!==0){var gray=0.299*r+0.587*g+0.114*b;r=gray+(r-gray)*(1+sat);g=gray+(g-gray)*(1+sat);b=gray+(b-gray)*(1+sat)}
  d[i]=Math.max(0,Math.min(255,r));d[i+1]=Math.max(0,Math.min(255,g));d[i+2]=Math.max(0,Math.min(255,b));
 }
 // Sharpen
 if(sharp>0&&orig){var amount=sharp*0.5;for(var y=1;y<h-1;y++){for(var x=1;x<w-1;x++){var idx=(y*w+x)*4;for(var c=0;c<3;c++){var center=orig[idx+c];var top=orig[idx-w*4+c];var bottom=orig[idx+w*4+c];var left=orig[idx-4+c];var right=orig[idx+4+c];var sharpened=center+(center-(top+bottom+left+right)/4)*amount;d[idx+c]=Math.max(0,Math.min(255,sharpened))}}}}
 // Skin Smoothing (bilateral-like blur on high-frequency areas)
 if(sm>0&&orig){
  var radius=Math.round(sm*3)+1;
  for(var y=0;y<h;y++){
   for(var x=0;x<w;x++){
    var idx=(y*w+x)*4;
    // Only smooth skin-tone areas (warm, moderate brightness)
    var rr=orig[idx],gg=orig[idx+1],bb=orig[idx+2];
    var isSkin=rr>60&&rr<255&&gg>40&&gg<220&&bb>30&&bb<200&&rr>gg&&gg>bb&&(rr-bb)>15;
    if(!isSkin)continue;
    var sr=0,sg=0,sb=0,sc=0;
    for(var dy=-radius;dy<=radius;dy++){
     for(var dx=-radius;dx<=radius;dx++){
      var nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=w||ny>=h)continue;
      var nidx=(ny*w+nx)*4;
      var nr=orig[nidx],ng=orig[nidx+1],nb=orig[nidx+2];
      // Weight by similarity (bilateral)
      var dist=Math.abs(nr-rr)+Math.abs(ng-gg)+Math.abs(nb-bb);
      var weight=Math.exp(-dist*dist/2000);
      sr+=nr*weight;sg+=ng*weight;sb+=nb*weight;sc+=weight;
     }
    }
    if(sc>0){
     var blend=sm*0.7;
     d[idx]=Math.max(0,Math.min(255,orig[idx]*(1-blend)+(sr/sc)*blend));
     d[idx+1]=Math.max(0,Math.min(255,orig[idx+1]*(1-blend)+(sg/sc)*blend));
     d[idx+2]=Math.max(0,Math.min(255,orig[idx+2]*(1-blend)+(sb/sc)*blend));
    }
   }
  }
 }
 // Vignette
 if(vig>0){var cx=w/2,cy=h/2;var maxDist=Math.sqrt(cx*cx+cy*cy);for(var y=0;y<h;y++){for(var x=0;x<w;x++){var idx=(y*w+x)*4;var dist=Math.sqrt((x-cx)*(x-cx)+(y-cy)*(y-cy))/maxDist;var factor=1-vig*dist*dist;d[idx]*=factor;d[idx+1]*=factor;d[idx+2]*=factor}}}
}

// AI Enhance
function aiEnhance(){
 if(!editBaseData)return;
 var btn=document.getElementById("aiBtn");
 var proc=document.getElementById("aiProcessing");
 btn.classList.add("loading");
 proc.classList.add("show");
 setTimeout(function(){
  try{
   // Simulate AI analysis: auto-enhance based on image statistics
   var d=new Uint8ClampedArray(editBaseData.data);
   var w=editImgW,h=editImgH;
   // Calculate histogram
   var total=0,brightnessSum=0;
   for(var i=0;i<d.length;i+=4){brightnessSum+=(d[i]+d[i+1]+d[i+2])/3;total++}
   var avgBright=brightnessSum/total;
   // Auto adjustments based on analysis
   var autoExp=avgBright<90?30:avgBright>180?-20:5;
   var autoCon=avgBright>100&&avgBright<160?15:25;
   var autoSat=10;
   var autoWarm=avgBright<100?15:5;
   var autoSharp=20;
   var autoSmooth=avgBright>80?25:0;
   // Apply to sliders
   var map={exposure:autoExp,contrast:autoCon,saturation:autoSat,warmth:autoWarm,sharpness:autoSharp,vignette:0,smooth:autoSmooth};
   ["exposure","contrast","saturation","warmth","sharpness","vignette","smooth"].forEach(function(k){
    var sl=document.getElementById("s-"+k);var vl=document.getElementById("v-"+k);
    if(sl){sl.value=map[k]||0;vl.textContent=map[k]||0}
   });
   // Reset preset selection
   document.querySelectorAll(".preset-card").forEach(function(c){c.classList.remove("active")});
   applyEdit();
   btn.classList.remove("loading");
   proc.classList.remove("show");
   showToast(t("aiDone"));
  }catch(e){
   btn.classList.remove("loading");
   proc.classList.remove("show");
   showToast(t("aiFail"));
  }
 },2000);
}
